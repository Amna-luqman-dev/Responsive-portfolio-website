<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="./style/contact.css">
</head>
<body>

<div class="contact-container">

    <div class="contact-card">

        <h1>Contact Me</h1>

        <div class="input-box">
            <label>Name</label>
            <input type="text" placeholder="Enter your name">
        </div>

        <div class="input-box">
            <label>Email</label>
            <input type="email" placeholder="Enter your email">
        </div>

        <div class="social-links">
            <a href="https://github.com/Amna-luqman-dev/Responsive-portfolio-website">LinkedIn</a>
            <a href="https://www.linkedin.com/in/amna-luqman-dev/">GitHub</a>
        </div>

    </div>

</div>

</body>
</html>
