<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfilo-project</title>
    <link rel="stylesheet" href="style/style.css">
    <link rel="stylesheet" href="style/footer.css">
</head>
<body>

    <!-- navbar -->
    <header >
        <div class="container">
        <div class="logo">
            <h1 style="color: rgb(240, 235, 235)">My Portfolio</h1>
        </div>

        <!-- links -->
       <nav> 
            <ul class="nav-links">
                
                    <li><a href="#home">Home</a></li>
                    <li><a href="#about">About</a></li>
                    <li><a href="#project">Projects</a></li>
                    <li><a href="#contact">Contact</a></li>
                    <li><a href="#skills">Skills</a></li>
                
            </ul>
        </nav> 
        </div>

    </header>

<section id="home"></section>
  <section id="about"></section>
  <section id="projects"></section>
  <section id="contact"></section>
  <section id="skills"></section>

  <script>
    // JS to load external HTML components
    function loadHTML(id, file) {
      fetch(file)
        .then(res => res.text())
        .then(data => document.getElementById(id).innerHTML = data);
    }

    loadHTML("home", "home.html");
    loadHTML("about", "about.html");
    loadHTML("projects", "projects.html");
    loadHTML("contact", "contact.html");
    loadHTML("skills", "skills.html");

  </script>

</html>
